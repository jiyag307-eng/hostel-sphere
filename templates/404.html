{% extends 'base.html' %}

{% block title %}Page Not Found (404) – HostelSphere{% endblock %}

{% block content %}
<div class="card" style="text-align: center; max-width: 520px; margin: 4rem auto; padding: 3.5rem 2rem; border: 1px solid var(--border-light); background: var(--white); box-shadow: var(--shadow-sm);">
  <div style="width: 4rem; height: 4rem; background: var(--grey-light); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.75rem; margin: 0 auto 1.5rem auto;">
    🔍
  </div>
  <h1 style="font-size: 1.85rem; font-weight: 800; color: var(--black); margin-bottom: 0.5rem; letter-spacing: -0.02em;">
    Page Not Found
  </h1>
  <p style="color: var(--text-muted); margin-bottom: 2rem; font-size: 0.95rem; line-height: 1.5;">
    The requested hostel portal page does not exist or has been relocated.
  </p>
  <div style="display: flex; gap: 0.75rem; justify-content: center; flex-wrap: wrap;">
    <a href="{{ url_for('index') }}" class="btn btn-secondary" style="font-weight: 700;">Home</a>
    <a href="{{ url_for('general_dashboard') }}" class="btn btn-primary" style="font-weight: 700;">My Dashboard &rarr;</a>
  </div>
</div>
{% endblock %}
